<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset PIN | Dinesh Online Solution</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/authentication.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-logo-icon"><i data-lucide="shield-check"></i></div>
        <div class="brand-text">
          <span class="brand-title">Dinesh Online Solution</span>
          <span class="brand-tagline">Your True Digital Companion</span>
        </div>
      </a>
      <a href="login.html" class="btn btn-outline btn-sm">Back to Login</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card animate-fade-in">
      <div class="auth-header">
        <div class="auth-logo-icon">
          <i data-lucide="key-round"></i>
        </div>
        <h2 class="auth-title">Reset Security PIN</h2>
        <p class="auth-subtitle">Verify your registered mobile number via SMS OTP to set a new PIN.</p>
      </div>

      <form id="forgotPinForm">
        <!-- Step 1: Mobile Number -->
        <div class="form-group">
          <label class="form-label required">Registered Mobile Number</label>
          <div style="display:flex; gap:0.5rem;">
            <div class="phone-input-wrapper" style="flex:1;">
              <span class="phone-prefix">+91</span>
              <input type="tel" id="forgotMobile" class="form-control phone-input" placeholder="9876543210"
                maxlength="10" required autofocus>
            </div>
            <button type="button" id="sendOtpBtn" class="btn btn-secondary">Get OTP</button>
          </div>
        </div>

        <!-- Step 2: OTP Verification (revealed after clicking Get OTP) -->
        <div id="otpSection" style="display:none; margin-bottom:1.25rem;">
          <div class="form-group">
            <label class="form-label required">Enter 6-Digit OTP</label>
            <div style="display:flex; gap:0.5rem;">
              <input type="text" id="otpCode" class="form-control" placeholder="123456" maxlength="6"
                inputmode="numeric">
              <button type="button" id="verifyOtpBtn" class="btn btn-primary">Verify</button>
            </div>
          </div>
        </div>

        <!-- Step 3: New PIN Creation (revealed after OTP verification) -->
        <div id="newPinSection" style="display:none;">
          <div class="form-row-2col" style="margin-bottom:1.5rem;">
            <div class="form-group">
              <label class="form-label required">New 4-Digit PIN</label>
              <input type="password" id="newPin" class="form-control" placeholder="••••" maxlength="4"
                inputmode="numeric">
            </div>
            <div class="form-group">
              <label class="form-label required">Confirm New PIN</label>
              <input type="password" id="confirmNewPin" class="form-control" placeholder="••••" maxlength="4"
                inputmode="numeric">
            </div>
          </div>

          <button type="submit" id="resetPinBtn" class="btn btn-primary btn-full btn-lg">
            <i data-lucide="check"></i> Update PIN
          </button>
        </div>
      </form>

      <div class="auth-footer-text">
        Remembered your PIN? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

  <script src="../js/config/firebase-config.js"></script>
  <script src="../js/i18n/translations.js"></script>
  <script src="../js/core/utilities.js"></script>
  <script src="../js/core/validation.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/auth/session.js"></script>
  <script src="../js/auth/pin-management.js"></script>
  <script src="../js/core/app.js"></script>
</body>

</html>
