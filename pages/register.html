<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration | Dinesh Online Solution</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/authentication.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-logo-icon"><i data-lucide="shield-check"></i></div>
        <div class="brand-text">
          <span class="brand-title">Dinesh Online Solution</span>
          <span class="brand-tagline">Your True Digital Companion</span>
        </div>
      </a>
      <a href="../index.html" class="btn btn-outline btn-sm">Back to Home</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card animate-fade-in" style="max-width: 480px;">
      <div class="auth-header">
        <div class="auth-logo-icon">
          <i data-lucide="user-plus"></i>
        </div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Join Dinesh Online Solution for instant service bookings & tracking.</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label required">Full Name (as per Aadhaar)</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Dinesh Kumar" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label required">10-Digit Mobile Number</label>
          <div class="phone-input-wrapper">
            <span class="phone-prefix">+91</span>
            <input type="tel" id="mobileNumber" class="form-control phone-input" placeholder="9876543210" maxlength="10"
              required>
          </div>
          <div class="form-hint">Used for SMS status tracking and authentication.</div>
        </div>

        <div class="form-row-2col">
          <div class="form-group">
            <label class="form-label required">Create 4-Digit PIN</label>
            <input type="password" id="createPin" class="form-control" placeholder="••••" maxlength="4"
              inputmode="numeric" required>
          </div>
          <div class="form-group">
            <label class="form-label required">Confirm PIN</label>
            <input type="password" id="confirmPin" class="form-control" placeholder="••••" maxlength="4"
              inputmode="numeric" required>
          </div>
        </div>

        <div class="auth-checkbox-row">
          <input type="checkbox" id="acceptTerms" required checked>
          <label for="acceptTerms">
            I accept the <a href="contact.html#terms" target="_blank">Terms of Service</a> & <a
              href="contact.html#privacy" target="_blank">Privacy Policy</a>
          </label>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-full btn-lg">
          <i data-lucide="check-circle"></i> Complete Registration
        </button>
      </form>

      <div class="auth-footer-text">
        Already registered? <a href="login.html">Sign In with your PIN</a>
      </div>
    </div>
  </main>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

  <script src="../js/config/firebase-config.js"></script>
  <script src="../js/i18n/translations.js"></script>
  <script src="../js/core/utilities.js"></script>
  <script src="../js/core/validation.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/auth/session.js"></script>
  <script src="../js/auth/register.js"></script>
  <script src="../js/core/app.js"></script>
</body>

</html>
