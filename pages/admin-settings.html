<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal & Business Settings | Admin Console</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/admin-dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <script src="../js/core/admin-guard.js"></script>
</head>
<body>

  <header class="site-header" style="background:#0F172A; border-bottom:1px solid rgba(255,255,255,0.08);">
    <div class="container header-inner">
      <a href="admin-dashboard.html" class="brand">
        <div class="brand-logo-icon"><i data-lucide="shield-check"></i></div>
        <div class="brand-text">
          <span class="brand-title" style="color:#fff;">Dinesh Online Solution</span>
          <span class="brand-tagline">Admin Console</span>
        </div>
      </a>

      <div class="header-actions">
        <button class="mobile-nav-toggle" onclick="document.querySelector('.admin-sidebar').classList.toggle('open')" style="color:#fff;">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-avatar-box">OP</div>
        <div class="admin-operator-meta">
          <div class="admin-operator-name">Dinesh Operator</div>
          <div class="admin-operator-role"><span class="status-dot-pulse"></span> Super Admin</div>
        </div>
      </div>

      <nav class="admin-sidebar-nav">
        <a href="admin-dashboard.html" class="admin-nav-link">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="admin-applications.html" class="admin-nav-link">
          <i data-lucide="file-check"></i> Applications
        </a>
        <a href="admin-customers.html" class="admin-nav-link">
          <i data-lucide="users"></i> Customers
        </a>
        <a href="admin-services.html" class="admin-nav-link">
          <i data-lucide="layers"></i> Services & Pricing
        </a>
        <a href="admin-payments.html" class="admin-nav-link">
          <i data-lucide="banknote"></i> Revenue & Ledger
        </a>
        <a href="admin-support.html" class="admin-nav-link">
          <i data-lucide="life-buoy"></i> Support Desk
        </a>
        <a href="admin-settings.html" class="admin-nav-link active">
          <i data-lucide="settings"></i> Portal Settings
        </a>
      </nav>

      <div style="padding:1rem 0.75rem; border-top:1px solid rgba(255,255,255,0.08);">
        <button class="admin-nav-link" onclick="window.adminLogout()" style="width:100%; color:#f87171;">
          <i data-lucide="log-out"></i> Admin Logout
        </button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="dashboard-header">
        <div class="dashboard-title-group">
          <h1>Portal & Business Information</h1>
          <p>Configure public helpline numbers, physical centre address, and website notices.</p>
        </div>
      </div>

      <div class="card" style="max-width:720px;">
        <form id="adminSettingsForm">
          <div class="form-row-2col">
            <div class="form-group">
              <label class="form-label required">Customer Helpline Mobile</label>
              <input type="text" id="settingPhone" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label required">Official WhatsApp Number</label>
              <input type="text" id="settingWhatsapp" class="form-control" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label required">Customer Support Email</label>
            <input type="email" id="settingEmail" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label required">Official Physical Centre Address</label>
            <textarea id="settingAddress" class="form-control" rows="2" required></textarea>
          </div>

          <div class="form-group">
            <label class="form-label required">Working Hours Display</label>
            <input type="text" id="settingHours" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label">Homepage Announcement Notice</label>
            <textarea id="settingAnnouncement" class="form-control" rows="2" placeholder="Banner text shown to all visitors..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="margin-top:1rem;">
            <i data-lucide="save"></i> Save Business Settings
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

  <script src="../js/config/firebase-config.js"></script>
  <script src="../js/i18n/translations.js"></script>
  <script src="../js/core/utilities.js"></script>
  <script src="../js/core/validation.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/auth/session.js"></script>
  <script src="../js/admin/settings.js"></script>
  <script src="../js/core/app.js"></script>
</body>
</html>
