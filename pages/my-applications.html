<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications | Dinesh Online Solution</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/customer-dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <script src="../js/core/auth-guard.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-logo-icon"><i data-lucide="shield-check"></i></div>
        <div class="brand-text">
          <span class="brand-title">Dinesh Online Solution</span>
          <span class="brand-tagline">My Applications</span>
        </div>
      </a>

      <div class="header-actions">
        <a href="services.html" class="btn btn-primary btn-sm">
          <i data-lucide="plus"></i> New Application
        </a>
        <button class="mobile-nav-toggle"
          onclick="document.querySelector('.dashboard-sidebar').classList.toggle('open')">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <div class="sidebar-user-card">
        <div class="user-avatar-lg customer-avatar-display">DK</div>
        <div class="user-info-text">
          <div class="user-display-name customer-name-display">Customer</div>
          <div class="user-display-id customer-id-display">CID-100234</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="customer-dashboard.html" class="sidebar-link">
          <i data-lucide="layout-dashboard"></i> Overview
        </a>
        <a href="services.html" class="sidebar-link">
          <i data-lucide="grid"></i> Browse Services
        </a>
        <a href="my-applications.html" class="sidebar-link active">
          <i data-lucide="file-text"></i> My Applications
        </a>
        <a href="profile.html#uploadDocs" class="sidebar-link">
          <i data-lucide="folder-up"></i> Document Vault
        </a>
        <a href="payment-history.html" class="sidebar-link">
          <i data-lucide="receipt"></i> Payment History
        </a>
        <a href="profile.html" class="sidebar-link">
          <i data-lucide="user"></i> My Profile & PIN
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-link" onclick="window.customerLogout()" style="width:100%; color:var(--error);">
          <i data-lucide="log-out"></i> Logout
        </button>
      </div>
    </aside>

    <main class="dashboard-main">
      <div class="dashboard-header">
        <div class="dashboard-title-group">
          <h1>Track My Applications</h1>
          <p>Real-time lifecycle tracking of all government and digital submissions.</p>
        </div>

        <div style="min-width:280px;">
          <input type="text" id="applicationSearchInput" class="form-control"
            placeholder="Search Application ID or service...">
        </div>
      </div>

      <!-- Status Filter Tabs -->
      <div class="filter-pills" id="applicationFilterTabs">
        <button class="filter-pill active" data-status="All">All Applications</button>
        <button class="filter-pill" data-status="Under Review">Under Review</button>
        <button class="filter-pill" data-status="Processing">Processing</button>
        <button class="filter-pill" data-status="Documents Required">Documents Required</button>
        <button class="filter-pill" data-status="Completed">Completed</button>
        <button class="filter-pill" data-status="Rejected">Rejected</button>
      </div>

      <!-- Applications Feed Container -->
      <div id="myApplicationsContainer">
        <!-- Rendered dynamically by applications.js -->
      </div>
    </main>
  </div>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

  <script src="../js/config/firebase-config.js"></script>
  <script src="../js/i18n/translations.js"></script>
  <script src="../js/core/utilities.js"></script>
  <script src="../js/core/validation.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/auth/session.js"></script>
  <script src="../js/payments/receipts.js"></script>
  <script src="../js/customer/applications.js"></script>
  <script src="../js/core/app.js"></script>
</body>

</html>
