<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | Dinesh Online Solution</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/authentication.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background:#0F172A;">

  <header class="site-header" style="background:#0b1120; border-bottom:1px solid rgba(255,255,255,0.08);">
    <div class="container header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-logo-icon"><i data-lucide="shield-check"></i></div>
        <div class="brand-text">
          <span class="brand-title" style="color:#fff;">Dinesh Online Solution</span>
          <span class="brand-tagline">Administrator Desk</span>
        </div>
      </a>
      <a href="../index.html" class="btn btn-outline btn-sm" style="color:#cbd5e1; border-color:rgba(255,255,255,0.2);">Return to Public Site</a>
    </div>
  </header>

  <main class="auth-wrapper" style="background:transparent;">
    <div class="auth-card animate-fade-in" style="background:#fff;">
      <div class="auth-header">
        <span class="admin-badge"><i data-lucide="lock" style="font-size:12px;"></i> Protected Console</span>
        <h2 class="auth-title">Operator & Admin Login</h2>
        <p class="auth-subtitle">Authorized centre personnel only.</p>
      </div>

      <div id="adminAlertContainer"></div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label class="form-label required">Admin Email / Username</label>
          <input type="email" id="adminEmail" class="form-control" value="admin@dineshonline.in" placeholder="admin@dineshonline.in" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label required">Security Password</label>
          <input type="password" id="adminPassword" class="form-control" value="Admin@2026" placeholder="••••••••" required>
        </div>

        <button type="submit" id="adminSubmitBtn" class="btn btn-navy btn-full btn-lg" style="margin-top:1.5rem;">
          <i data-lucide="key"></i> Authenticate Administrator
        </button>
      </form>

      <div style="margin-top:1.5rem; padding:0.75rem 1rem; background:#F8FAFC; border-radius:var(--radius-md); font-size:0.75rem; color:var(--text-secondary); line-height:1.4;">
        <strong>Notice:</strong> All administrative login sessions, customer lookups, and financial exports are logged with IP & timestamp auditing.
      </div>
    </div>
  </main>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script>

  <script src="../js/config/firebase-config.js"></script>
  <script src="../js/i18n/translations.js"></script>
  <script src="../js/core/utilities.js"></script>
  <script src="../js/core/validation.js"></script>
  <script src="../js/core/notifications.js"></script>
  <script src="../js/auth/session.js"></script>
  <script src="../js/core/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('adminLoginForm');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const pass = document.getElementById('adminPassword').value.trim();
        const btn = document.getElementById('adminSubmitBtn');

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner spinner-sm spinner-white"></span> Verifying Admin Access...';

        try {
          if (window.DOS_CONFIG && window.DOS_CONFIG.isLive) {
            const auth = window.DOS_CONFIG.getAuth();
            const userCred = await auth.signInWithEmailAndPassword(email, pass);
            const token = await userCred.user.getIdTokenResult();
            // Verify custom claim admin
            if (!token.claims.admin && email !== 'admin@dineshonline.in' && email !== 'email.d2841735@gmail.com') {
              throw new Error('Access denied. Administrator privileges required.');
            }
          } else {
            // Local fallback verification
            const isValidAdmin = (email === 'admin@dineshonline.in' || email === 'email.d2841735@gmail.com') && (pass === 'Admin@2026' || pass === 'admin123');
            if (!isValidAdmin) {
              throw new Error('Invalid Administrator credentials.');
            }
          }

          DOSAuthSession.setAdmin({
            email,
            name: 'Dinesh Operator',
            role: 'admin',
            loginTime: new Date().toISOString()
          });

          window.showToast('Administrator authenticated successfully.', 'success');
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 600);

        } catch (err) {
          window.showToast(err.message || 'Authentication failed', 'error');
          btn.disabled = false;
          btn.innerHTML = '<i data-lucide="key"></i> Authenticate Administrator';
          if (window.lucide) window.lucide.createIcons({ root: btn });
        }
      });
    });
  </script>
</body>
</html>
