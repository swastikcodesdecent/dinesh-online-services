<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123B72" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="aboutShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="540" height="400" rx="24" fill="url(#aboutGrad)" />

  <!-- Background decorative rings -->
  <circle cx="480" cy="80" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="40" />
  <circle cx="80" cy="340" r="90" fill="none" stroke="#F59E0B" stroke-opacity="0.1" stroke-width="20" />

  <!-- Main Showcase Card -->
  <rect x="50" y="50" width="440" height="300" rx="16" fill="#FFFFFF" filter="url(#aboutShadow)" />
  
  <rect x="75" y="80" width="180" height="8" rx="4" fill="#E2E8F0" />
  <text x="75" y="125" font-family="'Manrope', sans-serif" font-size="22" font-weight="800" fill="#123B72">Dinesh Online Solution</text>
  <text x="75" y="150" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F59E0B">YOUR TRUE DIGITAL COMPANION</text>
  
  <text x="75" y="185" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">Dedicated to empowering citizens with swift,</text>
  <text x="75" y="205" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">reliable & hassle-free government & utility</text>
  <text x="75" y="225" font-family="'Inter', sans-serif" font-size="13" fill="#64748B">services right at their fingertips.</text>

  <!-- Statistics Pillars -->
  <g transform="translate(75, 260)">
    <rect width="110" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="55" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#2563EB">10,000+</text>
    <text x="55" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">Happy Citizens</text>
  </g>

  <g transform="translate(200, 260)">
    <rect width="110" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="55" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#16A34A">99.8%</text>
    <text x="55" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">Success Rate</text>
  </g>

  <g transform="translate(325, 260)">
    <rect width="135" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="67" y="28" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="18" font-weight="800" fill="#F59E0B">40+ Services</text>
    <text x="67" y="46" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">One Single Stop</text>
  </g>
</svg>
