<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#123B72" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="20" y="20" width="560" height="440" rx="28" fill="url(#bgGrad)" />

  <!-- Center Portal / Laptop Screen -->
  <rect x="70" y="60" width="460" height="320" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="2" filter="url(#cardShadow)" />
  
  <!-- Window Bar -->
  <rect x="70" y="60" width="460" height="40" rx="16" fill="#123B72" />
  <circle cx="95" cy="80" r="5" fill="#EF4444" />
  <circle cx="112" cy="80" r="5" fill="#F59E0B" />
  <circle cx="129" cy="80" r="5" fill="#10B981" />
  <text x="155" y="85" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Dinesh Online Solution — Official Portal</text>

  <!-- Digital Service Grid Inside Mockup -->
  <!-- Service Tile 1: PAN Card -->
  <rect x="100" y="125" width="185" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
  <circle cx="130" cy="155" r="16" fill="#EFF6FF" />
  <path d="M124 151 H 136 V 159 H 124 Z" fill="#2563EB" />
  <text x="155" y="152" fill="#172033" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">PAN Card</text>
  <text x="155" y="168" fill="#16A34A" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Instant Verification</text>
  <rect x="100" y="195" width="185" height="4" fill="#2563EB" rx="2" />

  <!-- Service Tile 2: Aadhaar Assistance -->
  <rect x="315" y="125" width="185" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
  <circle cx="345" cy="155" r="16" fill="#FEF3C7" />
  <circle cx="345" cy="155" r="8" fill="#F59E0B" />
  <text x="370" y="152" fill="#172033" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Aadhaar Services</text>
  <text x="370" y="168" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Update & Download</text>

  <!-- Service Tile 3: Fast Bill Payment -->
  <rect x="100" y="245" width="185" height="105" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
  <circle cx="130" cy="275" r="16" fill="#DCFCE7" />
  <path d="M130 267 L 123 277 H 129 L 127 285 L 137 274 H 130 Z" fill="#16A34A" />
  <text x="155" y="272" fill="#172033" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Utility Bills</text>
  <text x="155" y="288" fill="#16A34A" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Instant Receipts</text>

  <!-- Service Tile 4: Govt Schemes & Forms -->
  <rect x="315" y="245" width="185" height="105" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
  <circle cx="345" cy="275" r="16" fill="#F3E8FF" />
  <text x="370" y="272" fill="#172033" font-family="'Manrope', sans-serif" font-size="13" font-weight="700">Online Forms</text>
  <text x="370" y="288" fill="#64748B" font-family="'Inter', sans-serif" font-size="11">Job & Admissions</text>

  <!-- Laptop Base -->
  <rect x="160" y="380" width="280" height="14" rx="4" fill="#CBD5E1" />
  <rect x="250" y="380" width="100" height="5" rx="2" fill="#94A3B8" />

  <!-- Floating Success Badge -->
  <g transform="translate(410, 40)" filter="url(#cardShadow)">
    <rect width="165" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="30" cy="26" r="14" fill="#DCFCE7" />
    <path d="M25 26 L 29 30 L 37 22" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" />
    <text x="52" y="24" fill="#172033" font-family="'Inter', sans-serif" font-size="12" font-weight="700">100% Verified</text>
    <text x="52" y="39" fill="#16A34A" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Secure Payments</text>
  </g>

  <!-- Floating Tracking Badge -->
  <g transform="translate(40, 360)" filter="url(#cardShadow)">
    <rect width="180" height="52" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
    <circle cx="30" cy="26" r="14" fill="#EFF6FF" />
    <circle cx="30" cy="26" r="6" fill="#2563EB" />
    <text x="52" y="24" fill="#172033" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Live SMS & Online</text>
    <text x="52" y="39" fill="#2563EB" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Track Application</text>
  </g>
</svg>
